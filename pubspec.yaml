name: nonogram
description: "Offline nonogram (picture logic) puzzle game built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2
  flutter: 3.41.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  nested: ^1.0.0
  hive_flutter: ^1.1.0
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  toastification: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/levels/
    - assets/guide/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
