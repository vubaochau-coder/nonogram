name: CI

# Bỏ qua các thay đổi chỉ ở tài liệu để tiết kiệm phút GitHub Actions
# (Distribute chạy sau CI nên cũng không build lại cho các thay đổi này).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    # Mặc định GitHub cho job chạy tới 6 tiếng; job bị treo sẽ ăn hết phút.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # .fvmrc is the single source of truth for the Flutter version.
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Check pubspec.yaml pins the same Flutter version
        run: |
          pubspec=$(sed -n 's/^  flutter: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}$/\1/p' pubspec.yaml)
          if [ "$pubspec" != "${{ steps.fvm.outputs.version }}" ]; then
            echo "pubspec.yaml environment.flutter ($pubspec) != .fvmrc (${{ steps.fvm.outputs.version }})"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
