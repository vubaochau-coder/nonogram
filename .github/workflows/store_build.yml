name: Store build

# Bản phát hành lên Google Play: flavor `store` (không có màn chọn chế độ chơi,
# chỉ có bộ màn có bản quyền). Chỉ chạy tay từ tab Actions, trên nhánh `main`;
# kết quả là file .aab đã ký ở mục Artifacts của lần chạy, tải về rồi tự đưa
# lên Play Console. Nhánh main không có CI tự động nên workflow này chạy
# format / analyze / test trước khi build.
#
# Build xong (đã qua test, đã upload artifact) thì gắn tag
# `v<versionName>+<buildNumber>` (ví dụ `v1.0.0+12`) vào đúng commit vừa build,
# làm mốc để so sánh các phiên bản: `git diff v1.0.0+11 v1.0.0+12`. Số build đã
# có tag thì dừng ngay từ đầu.
#
# Dùng chung các secret ký app với workflow Distribute:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Số build (versionCode), phải lớn hơn bản đã có trên Play
        required: true

permissions:
  # Để đẩy tag phiên bản.
  contents: write

jobs:
  build:
    name: Build store app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Lấy cả tag để kiểm tra trùng.
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the release tag
        id: tag
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "::error::Số build phải là số nguyên dương"; exit 1 ;;
          esac
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::Không đọc được version trong pubspec.yaml"
            exit 1
          fi
          tag="v${version}+${BUILD_NUMBER}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag đã có: số build $BUILD_NUMBER đã được build trước đó"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag sẽ gắn: $tag"

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Check build number
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "::error::Số build phải là số nguyên dương"; exit 1 ;;
          esac

      - run: flutter build appbundle --release --flavor store --build-number=${{ github.event.inputs.build_number }} --obfuscate --split-debug-info=build/symbols

      # Bộ màn của chế độ nhà phát triển (lấy từ nonogram.org) không được có
      # trong bản store.
      - name: Check developer levels are not bundled
        run: |
          aab=build/app/outputs/bundle/storeRelease/app-store-release.aab
          if unzip -l "$aab" | grep -q "assets/levels_dev/"; then
            echo "::error::Bản store đang chứa assets/levels_dev/"
            exit 1
          fi
          unzip -l "$aab" | grep -q "assets/levels/index.json"

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-nonogram-store-${{ github.event.inputs.build_number }}
          path: build/app/outputs/bundle/storeRelease/app-store-release.aab
          if-no-files-found: error

      # Symbols để giải mã (de-obfuscate) stack trace của bản đã --obfuscate.
      # Giữ lại theo từng build number; không bao giờ đưa vào app.
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-nonogram-store-symbols-${{ github.event.inputs.build_number }}
          path: build/symbols
          if-no-files-found: error

      # Mốc phiên bản: chỉ gắn khi mọi bước trên đều thành công.
      - name: Tag the built commit
        env:
          TAG: ${{ steps.tag.outputs.name }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" \
            -m "Store build $BUILD_NUMBER" -m "$RUN_URL"
          git push origin "refs/tags/$TAG"
          echo "### Đã gắn tag \`$TAG\` vào \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
