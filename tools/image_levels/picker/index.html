<title>Nonopix Level Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky toolbar + thumbnail strip, then a workspace of stage (original pinned top-left, puzzle centered) and a control panel. Palette mirrors the Nonopix app theme. */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #EEF0F6; --line: #E3E6EE;
  --fg: #1B1F2A; --muted: #5B6274; --accent: #3B5BDB; --on-accent: #FFFFFF;
  --ok: #1F9D63; --warn: #C98400; --bad: #D6453D; --cell: #1B1F2A; --grid: #DDE1EB;
  --unknown: rgba(242, 165, 22, .45); --clue: #DDE4FB;
  --paper: #FFFFFF; /* originals are shown on white in both themes, as they were drawn */
  --font: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1218; --surface: #171B23; --surface-2: #1C212B; --line: #2E3542;
  --fg: #E6E8EF; --muted: #9AA1B2; --accent: #91A7FF; --on-accent: #0F1A4A;
  --ok: #4CC38A; --warn: #F2B544; --bad: #FF7A6E; --cell: #E6E8EF; --grid: #2E3542;
  --unknown: rgba(242, 181, 68, .45); --clue: #242A35; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1218; --surface: #171B23; --surface-2: #1C212B; --line: #2E3542;
  --fg: #E6E8EF; --muted: #9AA1B2; --accent: #91A7FF; --on-accent: #0F1A4A;
  --ok: #4CC38A; --warn: #F2B544; --bad: #FF7A6E; --cell: #E6E8EF; --grid: #2E3542;
  --unknown: rgba(242, 181, 68, .45); --clue: #242A35; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-weight: 600; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.picked { background: var(--ok); } .dot.skipped { background: var(--bad); }
select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; scrollbar-width: thin; }
.thumb { position: relative; flex: none; width: 44px; height: 44px; border-radius: 10px; border: 2px solid transparent; background: var(--paper); padding: 4px; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb.current { border-color: var(--accent); }
.thumb:not(.current) { border-color: var(--line); }
.thumb .dot { position: absolute; right: 2px; bottom: 2px; border: 2px solid var(--paper); width: 11px; height: 11px; }

.banner { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 14px; }
.banner[data-tone="bad"] { color: var(--bad); }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 1240px; margin: 0 auto; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .workspace { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-height: 420px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage-head { display: flex; align-items: flex-start; gap: 12px; }
.orig { width: 76px; height: 76px; flex: none; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); padding: 6px; }
.orig img { width: 100%; height: 100%; object-fit: contain; display: block; }
.meta { min-width: 0; flex: 1; display: grid; gap: 4px; }
.meta input { width: 100%; font-size: 20px; font-weight: 800; border: 1px solid transparent; border-radius: 8px; padding: 2px 6px; margin-left: -6px; background: transparent; }
.meta input:hover, .meta input:focus { border-color: var(--line); background: var(--surface-2); }
.meta small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.nav { display: flex; gap: 6px; flex: none; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }

.board { flex: 1; display: grid; place-items: center; min-height: 300px; touch-action: none; }
canvas#grid { display: block; max-width: 100%; cursor: crosshair; border-radius: 4px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }
.hint { color: var(--muted); font-size: 12.5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 16px; min-width: 0; }
.group { display: grid; gap: 8px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.label output { font: 700 13px var(--mono); letter-spacing: 0; text-transform: none; color: var(--fg); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 7px 4px; border-radius: 7px; font-weight: 700; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); color: var(--accent); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { display: grid; justify-items: center; gap: 3px; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 5px; width: 56px; font: 700 11px var(--mono); color: var(--muted); }
.swatch i { display: block; width: 36px; height: 24px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); }
.swatch[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); }
.swatch[aria-pressed="true"]::after { content: "Tô"; font-size: 10px; color: var(--accent); }
.swatch[aria-pressed="false"]::after { content: "Trống"; font-size: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
.btn.danger { color: var(--bad); }
/* Pick/skip stay on screen at all times: fixed bar at the bottom edge. */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, .06);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.actionbar-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-left: auto; width: min(100%, 340px); flex: none; }
.actions .btn { padding: 11px 12px; font-size: 15px; }
.saved-note { font-size: 13px; color: var(--muted); min-width: 0; flex: 1; }
@media (max-width: 560px) { .actionbar-inner { flex-direction: column-reverse; align-items: stretch; gap: 6px; } .actions { width: 100%; } .saved-note:empty { display: none; } }
.saved-note[data-tone="ok"] { color: var(--ok); } .saved-note[data-tone="bad"] { color: var(--bad); }
[hidden] { display: none !important; }
kbd { font: 600 11px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .btn, .thumb, .seg button { transition: background .12s, border-color .12s; } }
</style>

<header class="top">
  <div class="top-row">
    <div class="brand">Nonopix <span>· Chọn màn</span></div>
    <div class="counts" id="counts">
      <span class="chip"><span class="dot picked"></span><span id="c-picked">0</span> đã chọn</span>
      <span class="chip"><span class="dot skipped"></span><span id="c-skipped">0</span> bỏ qua</span>
      <span class="chip"><span class="dot"></span><span id="c-left">0</span> chưa duyệt</span>
    </div>
    <label class="hint" for="filter">Hiện</label>
    <select id="filter">
      <option value="all">Tất cả</option>
      <option value="todo">Chưa duyệt</option>
      <option value="picked">Đã chọn</option>
      <option value="skipped">Bỏ qua</option>
    </select>
  </div>
  <nav class="strip" id="strip" aria-label="Danh sách ảnh"></nav>
</header>

<main class="wrap">
  <div class="banner" id="banner">Đang tải danh sách ảnh…</div>
  <div class="workspace" id="workspace" hidden>
    <section class="stage" aria-label="Kết quả chuyển đổi">
      <div class="stage-head">
        <div class="orig" title="Ảnh gốc"><img id="orig" alt="Ảnh gốc"></div>
        <div class="meta">
          <input id="title" aria-label="Tên màn" autocomplete="off">
          <small id="source"></small>
        </div>
        <div class="nav">
          <button class="icon-btn" id="prev" aria-label="Ảnh trước">←</button>
          <button class="icon-btn" id="next" aria-label="Ảnh sau">→</button>
        </div>
      </div>
      <div class="board" id="board"><canvas id="grid" aria-label="Lưới nonogram"></canvas></div>
      <div class="status" id="status"></div>
      <div class="hint">Chạm hoặc kéo trên lưới để tô/xoá từng ô. Ô cam = suy luận chưa tới được. Chấm màu = ô đã sửa tay. Phím tắt: <kbd>←</kbd> <kbd>→</kbd> chuyển ảnh, <kbd>Enter</kbd> chọn, <kbd>S</kbd> bỏ qua, <kbd>N</kbd> âm bản.</div>
    </section>

    <aside class="panel" aria-label="Tuỳ chọn chuyển đổi">
      <div class="group" id="g-mode">
        <div class="label">Cách chuyển</div>
        <div class="seg" id="mode">
          <button data-mode="silhouette">Hình bóng</button>
          <button data-mode="brightness">Độ sáng</button>
          <button data-mode="color">Theo màu</button>
        </div>
        <div class="hint" id="mode-hint"></div>
      </div>

      <div class="group" id="g-size">
        <div class="label"><label for="size">Độ phân giải (cạnh dài)</label><output id="size-out"></output></div>
        <input type="range" id="size" min="5" max="40" step="1">
      </div>

      <div class="group" id="g-threshold">
        <div class="label"><label for="threshold">Ngưỡng sáng / tối</label><output id="threshold-out"></output></div>
        <input type="range" id="threshold" min="0" max="100" step="1">
        <label class="check"><input type="checkbox" id="invert"> Đục lỗ: tô phần sáng, chừa trống phần tối</label>
      </div>

      <div class="group" id="g-color">
        <div class="label"><label for="k">Số màu gom</label><output id="k-out"></output></div>
        <input type="range" id="k" min="2" max="8" step="1">
        <div class="hint">Bấm từng màu để chọn tô hay để trống.</div>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="group" id="g-coverage">
        <div class="label"><label for="coverage">Độ phủ để tô một ô</label><output id="coverage-out"></output></div>
        <input type="range" id="coverage" min="20" max="80" step="5">
      </div>

      <div class="group" id="g-pixel">
        <label class="check"><input type="checkbox" id="half"> Thu nhỏ ½: gộp mỗi khối 2×2 thành 1 ô</label>
        <div class="hint" id="half-hint"></div>
        <label class="check"><input type="checkbox" id="solid"> Lấp kín phần bên trong nét viền</label>
      </div>

      <div class="group">
        <label class="check" id="g-cleanup"><input type="checkbox" id="cleanup"> Dọn ô lẻ loi</label>
        <label class="check"><input type="checkbox" id="negative"> Âm bản: đảo ô tô ↔ ô trống</label>
        <div class="label"><label for="pad">Lề quanh hình</label><output id="pad-out"></output></div>
        <input type="range" id="pad" min="0" max="5" step="1">
        <div class="row">
          <button class="btn" id="autofix">Tự sửa cho giải được</button>
          <button class="btn" id="clear-edits">Xoá sửa tay</button>
          <button class="btn" id="reset">Về gợi ý</button>
        </div>
      </div>

    </aside>
  </div>
</main>

<footer class="actionbar" aria-label="Thao tác">
  <div class="actionbar-inner">
    <div class="saved-note" id="saved-note" aria-live="polite"></div>
    <div class="actions">
      <button class="btn danger" id="skip">Bỏ qua</button>
      <button class="btn primary" id="pick">Chọn màn này</button>
    </div>
  </div>
</footer>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const SS = 8;                 // sub-pixels per cell side when sampling
const MAX_FLIP_RATIO = 0.03;  // auto-fix budget

// ---------------------------------------------------------------- solver
function cluesOf(line) { const out = []; let run = 0; for (const v of line) { if (v === 1) run++; else if (run) { out.push(run); run = 0; } } if (run) out.push(run); return out; }
function deriveClues(g) { const rows = g.length, cols = g[0].length; const rc = g.map(cluesOf); const cc = []; for (let c = 0; c < cols; c++) cc.push(cluesOf(Array.from({ length: rows }, (_, r) => g[r][c]))); return { rc, cc }; }
function solveLine(line, clues) {
  const n = line.length + 1, cells = [0, ...line], k = clues.length;
  const canEmpty = (i) => cells[i] !== 1;
  const blocked = new Int32Array(n + 1);
  for (let i = 0; i < n; i++) blocked[i + 1] = blocked[i] + (cells[i] === 0 ? 1 : 0);
  const canFill = (from, len) => { const to = from + len; return to <= n && blocked[to] - blocked[from] === 0; };
  const fwd = Array.from({ length: n + 1 }, () => new Uint8Array(k + 1)); fwd[0][0] = 1;
  for (let i = 0; i < n; i++) { if (!canEmpty(i)) continue; for (let j = 0; j <= k; j++) { if (!fwd[i][j]) continue; fwd[i + 1][j] = 1; if (j < k && canFill(i + 1, clues[j])) fwd[i + 1 + clues[j]][j + 1] = 1; } }
  if (!fwd[n][k]) return null;
  const bwd = Array.from({ length: n + 2 }, () => new Uint8Array(k + 1)); bwd[n][k] = 1;
  for (let i = n - 1; i >= 0; i--) { if (!canEmpty(i)) continue; for (let j = k; j >= 0; j--) { let ok = bwd[i + 1][j]; if (!ok && j < k) { const end = i + 1 + clues[j]; ok = end <= n && canFill(i + 1, clues[j]) && bwd[end][j + 1]; } bwd[i][j] = ok ? 1 : 0; } }
  const mayEmpty = new Uint8Array(n), diff = new Int32Array(n + 1);
  for (let i = 0; i < n; i++) { if (!canEmpty(i)) continue; for (let j = 0; j <= k; j++) { if (!fwd[i][j]) continue; if (bwd[i + 1][j]) mayEmpty[i] = 1; if (j < k) { const end = i + 1 + clues[j]; if (end <= n && canFill(i + 1, clues[j]) && bwd[end][j + 1]) { mayEmpty[i] = 1; diff[i + 1]++; diff[end]--; } } } }
  const res = new Array(line.length).fill(-1); let run = 0;
  for (let i = 0; i < n; i++) { run += diff[i]; if (!i) continue; const mf = run > 0; if (mf && !mayEmpty[i]) res[i - 1] = 1; else if (!mf && mayEmpty[i]) res[i - 1] = 0; else if (!mf && !mayEmpty[i]) return null; }
  return res;
}
function analyze(sol) {
  const { rc, cc } = deriveClues(sol); const rows = sol.length, cols = sol[0].length;
  const g = sol.map((r) => r.map(() => -1));
  const dr = new Array(rows).fill(true), dc = new Array(cols).fill(true);
  let rounds = 0, lineSolves = 0, changed = true, ok = true;
  outer: while (changed) {
    changed = false; rounds++;
    for (let r = 0; r < rows; r++) { if (!dr[r]) continue; dr[r] = false; const s = solveLine(g[r], rc[r]); if (!s) { ok = false; break outer; } let p = false; for (let c = 0; c < cols; c++) if (s[c] !== g[r][c]) { g[r][c] = s[c]; dc[c] = true; changed = p = true; } if (p) lineSolves++; }
    for (let c = 0; c < cols; c++) { if (!dc[c]) continue; dc[c] = false; const line = Array.from({ length: rows }, (_, r) => g[r][c]); const s = solveLine(line, cc[c]); if (!s) { ok = false; break outer; } let p = false; for (let r = 0; r < rows; r++) if (s[r] !== g[r][c]) { g[r][c] = s[r]; dr[r] = true; changed = p = true; } if (p) lineSolves++; }
  }
  const solved = ok && g.every((r) => r.every((v) => v !== -1));
  return { lineSolvable: solved, rounds, lineSolves, partial: g };
}
const knownCount = (p) => p.reduce((n, r) => n + r.filter((v) => v !== -1).length, 0);
function repair(sol, maxFlips) {
  const g = sol.map((r) => [...r]); const rows = g.length, cols = g[0].length; const flips = [];
  let a = analyze(g);
  while (!a.lineSolvable) {
    if (flips.length >= maxFlips) return null;
    const base = knownCount(a.partial);
    const at = (r, c) => (r >= 0 && r < rows && c >= 0 && c < cols ? g[r][c] : 0);
    let best = null;
    search: for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (a.partial[r][c] !== -1) continue;
      const v = g[r][c]; const n = at(r - 1, c) + at(r + 1, c) + at(r, c - 1) + at(r, c + 1);
      if (v === 0 ? n === 0 : n === 4) continue;
      g[r][c] = 1 - v; const b = analyze(g); g[r][c] = v;
      const gain = b.lineSolvable ? Infinity : knownCount(b.partial) - base;
      if (gain > 0 && (!best || gain > best.gain)) best = { r, c, gain };
      if (gain === Infinity) break search;
    }
    if (!best) return null;
    g[best.r][best.c] = 1 - g[best.r][best.c]; flips.push([best.r, best.c]); a = analyze(g);
  }
  return flips;
}
function difficultyScore(rows, cols, lineSolves, rounds) {
  const size = Math.min(1, (rows * cols) / 900), work = Math.min(1, lineSolves / (2.5 * (rows + cols))), depth = Math.min(1, (rounds - 1) / 10);
  return Math.round(Math.min(1, 0.55 * size + 0.25 * work + 0.2 * depth) * 100) / 100;
}

// ---------------------------------------------------------------- image helpers
const svgUrl = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', { willReadFrequently: true })]; }
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
const lumOf = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
function otsu(values) {
  const bins = 64, hist = new Array(bins).fill(0); for (const v of values) hist[Math.min(bins - 1, Math.floor(v * bins))]++;
  const total = values.length; let sum = 0; for (let i = 0; i < bins; i++) sum += i * hist[i];
  let sB = 0, wB = 0, best = 0, t = 0.5;
  for (let i = 0; i < bins; i++) { wB += hist[i]; if (!wB) continue; const wF = total - wB; if (!wF) break; sB += i * hist[i]; const v = wB * wF * (sB / wB - (sum - sB) / wF) ** 2; if (v > best) { best = v; t = (i + 1) / bins; } }
  return t;
}

}
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
$('filter').onchange = (e) => { filter = e.target.value; renderStrip(); };
for (const b of $('mode').children) b.onclick = () => {
  cur.params.mode = b.dataset.mode;
  if (cur.params.mode === 'color' && !cur.params.colorsOn) cur.params.colorsOn = defaultColorsOn(paletteOf(cur.entry, cur.params.k));
  syncControls(); recompute(true);
};
const onRange = (id, fn) => $(id).addEventListener('input', (e) => { fn(+e.target.value); syncControls(); recompute(true); });
onRange('size', (v) => (cur.params.size = v));
onRange('threshold', (v) => (cur.params.threshold = v / 100));
onRange('coverage', (v) => (cur.params.coverage = v / 100));
onRange('k', (v) => { cur.params.k = v; cur.params.colorsOn = defaultColorsOn(paletteOf(cur.entry, v)); });
$('invert').onchange = (e) => { cur.params.invert = e.target.checked; cur.params.threshold = e.target.checked ? cur.entry.otsuInside : cur.entry.otsuAll; syncControls(); recompute(true); };
$('solid').onchange = (e) => { cur.params.solid = e.target.checked; recompute(true); };
$('half').onchange = (e) => { cur.params.half = e.target.checked; syncControls(); recompute(true); };
$('cleanup').onchange = (e) => { cur.params.cleanup = e.target.checked; recompute(true); };
$('negative').onchange = (e) => { cur.params.negative = e.target.checked; recompute(true); };
document.addEventListener('keydown', (e) => { if ((e.key === 'n' || e.key === 'N') && !e.target.closest('input, select, textarea')) { $('negative').click(); } });
$('pad').addEventListener('input', (e) => { cur.params.pad = +e.target.value; syncControls(); recompute(true); });
$('reset').onclick = () => { cur.params = suggestedParams(cur.icon, cur.entry); cur.edits = new Set(); cur.base = null; cur.pad = null; syncControls(); recompute(false); };
$('clear-edits').onclick = () => { cur.edits.clear(); applyEdits(); };
$('autofix').onclick = () => {
  const g = cur.final; const flips = repair(g, Math.max(1, Math.round(MAX_FLIP_RATIO * g.length * g[0].length)));
  if (!flips) { note('Không tự sửa được với ít ô. Thử đổi thông số hoặc sửa tay các ô cam.', 'bad'); return; }
  for (const [r, c] of flips) { const k = r + ',' + c; if (cur.edits.has(k)) cur.edits.delete(k); else cur.edits.add(k); }
  applyEdits(); note(`Đã lật ${flips.length} ô (chấm màu) để màn giải được.`, 'ok');
};

// Paint on the grid.
let painting = null;
function cellAt(e) { const r = $('grid').getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / cur.cell), row = Math.floor((e.clientY - r.top) / cur.cell); return row >= 0 && row < cur.final.length && c >= 0 && c < cur.final[0].length ? [row, c] : null; }
function paint(rc) { if (!rc) return; const [r, c] = rc; const k = r + ',' + c; if (cur.final[r][c] === painting.value) return; if (cur.base[r][c] === painting.value) cur.edits.delete(k); else cur.edits.add(k); applyEdits(); }
$('grid').addEventListener('pointerdown', (e) => { const rc = cellAt(e); if (!rc) return; e.preventDefault(); $('grid').setPointerCapture(e.pointerId); painting = { value: 1 - cur.final[rc[0]][rc[1]] }; paint(rc); });
$('grid').addEventListener('pointermove', (e) => { if (painting) paint(cellAt(e)); });
const stopPaint = () => { painting = null; };
$('grid').addEventListener('pointerup', stopPaint); $('grid').addEventListener('pointercancel', stopPaint);

async function save(status) {
  if (!db) return;
  const icon = cur.icon; const ref = db.collection('picks').doc(docId(icon.key));
  const data = { key: icon.key, set: icon.set, icon: icon.icon, title: $('title').value.trim() || icon.title, author: icon.author, license: icon.license, status, updatedAt: new Date().toISOString() };
  if (status === 'picked') {
    const g = cur.final; const i = cur.info; const filled = g.flat().reduce((a, b) => a + b, 0);
    Object.assign(data, {
      rows: g.length, cols: g[0].length, solution: g.map((r) => r.join('')),
      density: Math.round((filled / (g.length * g[0].length)) * 1000) / 1000,
      difficultyScore: difficultyScore(g.length, g[0].length, i.lineSolves, i.rounds),
      params: { ...cur.params }, edits: [...cur.edits].map((k) => k.split(',').map(Number)),
    });
  }
  const btn = status === 'picked' ? $('pick') : $('skip'); btn.disabled = true;
  try {
    await ref.set(data); picks.set(icon.key, data); renderStrip();
    note(status === 'picked' ? `Đã chọn “${data.title}”.` : `Đã bỏ qua “${data.title}”.`, 'ok');
    setTimeout(nextTodo, 350);
  } catch (err) { note('Không lưu được: ' + (err?.message ?? 'lỗi không rõ') + '. Thử lại sau.', 'bad'); }
  finally { btn.disabled = false; renderStatus(); }
}
$('pick').onclick = () => save('picked');
$('skip').onclick = () => save('skipped');
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea') && e.key !== 'Enter') return;
  if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
  else if (e.key === 'Enter' && !$('pick').disabled) { save('picked'); e.preventDefault(); }
  else if ((e.key === 's' || e.key === 'S') && !e.target.closest('input')) save('skipped');
});
window.addEventListener('resize', () => cur && draw());
const redraw = () => cur && draw();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------------------------------------------------------- boot
async function boot() {
  try {
    const res = await fetch('icons.json'); if (!res.ok) throw new Error('HTTP ' + res.status);
    icons = (await res.json()).icons;
    iconByKey = new Map(icons.map((ic) => [ic.key, ic]));
  } catch (err) { $('banner').dataset.tone = 'bad'; $('banner').textContent = 'Không tải được danh sách ảnh (' + err.message + '). Tải lại trang để thử lại.'; return; }
  $('workspace').hidden = false;
  $('banner').textContent = 'Đang kết nối nơi lưu kết quả…';
  let start = 0;
  try { const last = localStorage.getItem('nonopix-picker-last'); const i = icons.findIndex((ic) => ic.key === last); if (i >= 0) start = i; } catch {}
  await open(start);

  const timer = setTimeout(() => { if (!db) { $('banner').dataset.tone = 'bad'; $('banner').textContent = 'Chưa kết nối được nơi lưu. Bạn vẫn thử được thông số, nhưng chưa bấm Chọn được.'; } }, 10000);
  const cap = window.claude?.use ? await window.claude.use('db').catch(() => null) : null;
  if (!cap) { clearTimeout(timer); $('banner').dataset.tone = 'bad'; $('banner').textContent = 'Không lưu được ở chế độ xem này. Mở trang trên claude.ai khi đã đăng nhập để chọn màn.'; renderStatus(); return; }
  cap.collection('picks').onSnapshot((snap) => {
    clearTimeout(timer); db = cap; $('banner').hidden = true;
    picks = new Map(snap.docs.map((d) => [d.data().key, d.data()]));
    renderStrip(); renderStatus();
  }, (err) => { clearTimeout(timer); $('banner').hidden = false; $('banner').dataset.tone = 'bad'; $('banner').textContent = 'Lỗi kết nối nơi lưu: ' + err.message; });
}
boot();
})();
</script>
